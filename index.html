<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Locator</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Internal CSS -->
  <style>
    body {
      background-image: url("https://images.unsplash.com/photo-1518770660439-4636190af475?w=1600");
      /* Abstract tech / circuit board background */
      background-image: url("https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=1600");
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
    }

    .box {
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 10px;
      margin-top: 60px;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 36px;
      font-weight: bold;
    }

    h2 {
      font-size: 24px;
    }

    h3 {
      font-size: 20px;
      color: #00d4ff;
    }

    a {
      color: #00d4ff;
    }
  </style>
</head>

<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Product Locator</a>

        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Shop</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Locate</a>
            </li>
          </ul>

          <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search">
            <button class="btn btn-light" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <!-- Page Title -->
  <h1 class="mt-4">Product Locator</h1>

  <div class="container">
    <div class="box">

      <!-- Section Heading -->
      <h2>Find a Gaming Laptop</h2>

      <!-- Instructions -->
      <p>Enter your budget and we will recommend a laptop brand for you.</p>

      <!-- Budget input -->
      <input type="number" id="budget" class="form-control w-50 mx-auto" placeholder="Enter your budget">

      <br>

      <!-- Button with onclick event -->
      <button onclick="recommendLaptop()" class="btn btn-primary">Find Laptop</button>

      <br><br>

      <!-- Result output -->
      <h3 id="result"></h3>
      <p id="eligible"></p>

      <hr style="border-color: rgba(255,255,255,0.2);">

      <!-- Hyperlink to source -->
      <p>Source: <a href="https://www.w3schools.com" target="_blank">W3Schools</a></p>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript -->
  <script>

    // Function that runs when the button is clicked
    function recommendLaptop() {

      // Get the user's budget input (number data type)
      let budget = Number(document.getElementById("budget").value);

      // String variable to store the recommended brand
      let brand;

      // Arithmetic operator to compute discounted budget (10% off)
      let discounted = budget - (budget * 0.10);

      // Check the budget range using comparison operators and assign a brand
      if (budget >= 80000) {
        brand = "Razer";
      }
      else if (budget >= 60000) {
        brand = "Asus";
      }
      else if (budget >= 40000) {
        brand = "Acer";
      }
      else if (budget >= 25000) {
        brand = "Lenovo";
      }
      else {
        brand = "Budget too low for gaming laptops.";
      }

      // Display the recommended brand
      document.getElementById("result").innerHTML = "Recommended Brand: " + brand;

      // Display the discounted price using string concatenation
      if (budget >= 25000) {
        document.getElementById("eligible").innerHTML =
          "You are eligible for a 10% discount. Estimated price: P" + discounted.toLocaleString();
      } else {
        document.getElementById("eligible").innerHTML = "";
      }

    }

  </script>

</body>
</html>
